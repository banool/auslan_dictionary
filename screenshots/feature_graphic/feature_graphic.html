<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- Source of feature_graphic.png next to this file. Colours are dictionarylib's
     Hearth light tokens; hands.png is assets/icon/01-okay-splash.png cropped
     and recoloured to the Hearth ink. Render it at exactly 1024x500 with any
     headless Chromium, from this directory:
       chromium --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1024,500 --virtual-time-budget=10000 \
         --screenshot=feature_graphic.png feature_graphic.html
     then upload it to the en-US listing's featureGraphic slot. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@500;600&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #FBF5EE; display: flex; align-items: center; justify-content: center; gap: 52px;
         font-family: 'Hanken Grotesk', sans-serif; color: #2A201A; position: relative; }
  .blob { position: absolute; border-radius: 50%; background: #F6D9C8; opacity: 0.55; }
  .b1 { width: 520px; height: 520px; left: -170px; top: -150px; }
  .b2 { width: 360px; height: 360px; right: -120px; bottom: -170px; }
  img { width: 270px; position: relative; }
  .text { position: relative; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 74px; line-height: 1; margin: 0 0 18px; letter-spacing: -1.5px; }
  .tag { font-size: 40px; font-weight: 600; color: #B06544; margin: 0 0 22px; }
  .sub { font-size: 30px; font-weight: 500; color: #6F6155; margin: 0; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <img src="hands.png" alt="" />
  <div class="text">
    <h1>Auslan Dictionary</h1>
    <p class="tag">Australian Sign Language</p>
    <p class="sub">8,600+ signs, each with a video</p>
  </div>
</body>
</html>
