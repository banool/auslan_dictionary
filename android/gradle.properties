org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier disabled: `./gradlew checkJetifier` reports no project uses legacy
# com.android.support libraries, so the AndroidX bytecode-rewrite transform is
# pure build-time overhead. Re-enable if a future dependency pulls one in.
android.enableJetifier=false
# Built-in Kotlin (AGP 9+) stays OFF for now: msal_auth (3.5.3) still applies
# the Kotlin Gradle plugin unconditionally in its android/build.gradle.kts, and
# AGP 9 refuses that combination outright ("no longer required for Kotlin
# support since AGP 9.0"). Every other plugin we use is migrated, so flip this
# to true and drop `id "kotlin-android"` from app/build.gradle once msal_auth
# ships its migration (nayanAubie/msal_auth#152). Until then Flutter prints a
# "migrate to built-in Kotlin" notice on every Android build; it is harmless.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
